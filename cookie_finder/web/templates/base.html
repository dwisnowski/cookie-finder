<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Cookie Finder{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/thermal-viewer.css">
    <script>
        (function () {
            try {
                var id = localStorage.getItem('cookieFinder.accentTheme') || 'amber';
                document.documentElement.setAttribute('data-accent', id);
            } catch (e) {
                document.documentElement.setAttribute('data-accent', 'amber');
            }
        })();
    </script>
    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="/static/qrcode.min.js"></script>
    <script src="/static/thermal-viewer.js"></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
