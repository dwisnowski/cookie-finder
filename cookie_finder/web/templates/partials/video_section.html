        <div class="video-section">
            <div class="video-gimbal-row">
                <div class="video-stream-frame" id="videoStreamFrame">
                    <img id="videoStream" src="/video" alt="Thermal camera feed" class="video-stream">
                    <div class="video-touch-pad mobile-only" aria-hidden="true">
                        <span class="touch-zone-spacer"></span>
                        <button type="button" class="touch-zone" data-motor="motor_up" aria-label="Tilt up"></button>
                        <span class="touch-zone-spacer"></span>
                        <button type="button" class="touch-zone" data-motor="motor_left" aria-label="Pan left"></button>
                        <button type="button" class="touch-zone touch-zone-home" data-action="motor_home" aria-label="Go home"></button>
                        <button type="button" class="touch-zone" data-motor="motor_right" aria-label="Pan right"></button>
                        <span class="touch-zone-spacer"></span>
                        <button type="button" class="touch-zone" data-motor="motor_down" aria-label="Tilt down"></button>
                        <span class="touch-zone-spacer"></span>
                    </div>
                </div>
                <div class="gimbal-slider-vertical mobile-only">
                    <div class="gimbal-track gimbal-track-tilt">
                        <div class="gimbal-track-center"></div>
                        <div class="gimbal-thumb" id="tiltSliderThumb"></div>
                    </div>
                </div>
            </div>
            <div class="gimbal-slider-horizontal mobile-only">
                <div class="gimbal-track gimbal-track-pan">
                    <div class="gimbal-track-center"></div>
                    <div class="gimbal-thumb" id="panSliderThumb"></div>
                </div>
            </div>
            <div class="status">
                <div id="statusText">Connecting...</div>
            </div>
            <!-- Palette Controls (shown when Palette mode is active) -->
            <div class="palette-panel" id="palettePanel">
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <button class="btn" id="btn_palette_prev" style="flex: 1; font-size: 11px;">← Prev</button>
                    <button class="btn" id="btn_palette_next" style="flex: 1; font-size: 11px;">Next →</button>
                </div>
                <div id="currentPaletteInfo" style="background: rgba(45, 55, 72, 0.5); padding: var(--spacing-md); border-radius: var(--radius-md); border: 1px solid var(--border-color); font-size: 11px; text-align: center; color: var(--text-secondary); transition: all var(--transition-normal);">
                    <span id="currentPaletteName">Ironbow</span>
                </div>
            </div>
            <!-- Parameters (shown when Isotherm mode is active) -->
            <div class="parameters-panel" id="parametersPanel">
                <div class="slider-group">
                    <div class="slider-label">Threshold: <span id="val_threshold">127</span></div>
                    <input type="range" min="0" max="255" value="127" id="slider_threshold_value">
                </div>
                <div class="slider-group">
                    <div class="slider-label">Isotherm Min: <span id="val_isotherm_min">100</span></div>
                    <input type="range" min="0" max="255" value="100" id="slider_isotherm_min">
                </div>
                <div class="slider-group">
                    <div class="slider-label">Isotherm Max: <span id="val_isotherm_max">200</span></div>
                    <input type="range" min="0" max="255" value="200" id="slider_isotherm_max">
                </div>
            </div>
        </div>
