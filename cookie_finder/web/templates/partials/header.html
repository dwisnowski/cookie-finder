    <div class="header">
        <div class="header-badges">
            <button type="button" class="badge badge-clickable" id="badge_rust" data-badge-tip="rust" title="Rust gimbal daemon — click for tips" aria-label="Rust daemon status">
                <span class="badge-dot" id="badge_rust_dot"></span>
                <span id="badge_rust_text">Rust —</span>
            </button>
            <button type="button" class="badge badge-clickable" id="badge_gamepad" data-badge-tip="gamepad" title="Gamepad — click for tips" aria-label="Gamepad status">
                <span class="badge-dot" id="badge_gamepad_dot"></span>
                <span id="badge_gamepad_text">—</span>
            </button>
            <button type="button" class="badge badge-clickable" id="badge_camera" data-badge-tip="camera" title="Camera — click for tips" aria-label="Camera status">
                <span class="badge-dot" id="badge_camera_dot"></span>
                <span id="badge_camera_text">—</span>
            </button>
            <button type="button" class="badge badge-clickable" id="badge_wifi" data-badge-tip="wifi" title="WiFi mode — click for tips" aria-label="WiFi status">
                <span class="badge-dot" id="badge_wifi_dot"></span>
                <span id="badge_wifi_text">WiFi —</span>
            </button>
            <button type="button" class="badge badge-clickable" id="badge_cloudflare" data-badge-tip="cloudflare" title="Cloudflare Tunnel — click for tips" aria-label="Cloudflare Tunnel status">
                <span class="badge-dot" id="badge_cloudflare_dot"></span>
                <span id="badge_cloudflare_text">CF —</span>
            </button>
            <button type="button" class="badge badge-clickable" id="badge_fps" data-badge-tip="fps" title="Stream rate — click for tips" aria-label="Stream rate">
                <span class="badge-dot badge-dot.active" id="badge_fps_dot"></span>
                <span id="badge_fps_text">50 Hz</span>
            </button>
        </div>
        <h1>Cookie Finder</h1>
        <div class="header-actions">
            <button class="header-help mobile-only" id="btn_motor" title="Motor control" aria-label="Motor control">
                <i class="bi bi-joystick"></i>
            </button>
            <button class="header-help" id="btn_connect" title="Connect" aria-label="Show connect QR code">
                <i class="bi bi-qr-code"></i>
            </button>
            <button class="header-help" id="btn_settings" title="Settings" aria-label="Settings">
                <i class="bi bi-gear-fill"></i>
            </button>
            <button class="header-help" id="btn_help" title="Help" aria-label="Help">
                <i class="bi bi-question-circle-fill"></i>
            </button>
        </div>
    </div>
