        <div class="sidebar-left">
            <!-- Motor Control -->
            <div class="section">
                <div class="section-title">Motor Control</div>
                
                <!-- Gamepad Buttons Display -->
                <div style="background: rgba(45, 55, 72, 0.5); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-md); text-align: center; border: 1px solid var(--border-color);">
                    <div style="color: var(--text-tertiary); margin-bottom: 8px; font-size: 11px; font-weight: bold;">Button Press Display</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px;">
                        <div class="gamepad-button" id="gamepadButton0" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">A</div>
                        <div class="gamepad-button" id="gamepadButton1" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">B</div>
                        <div class="gamepad-button" id="gamepadButton2" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">X</div>
                        <div class="gamepad-button" id="gamepadButton3" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">Y</div>
                    </div>
                </div>
                <div style="text-align: center; margin-bottom: 15px;">
                    <svg id="panTiltIndicator" width="200" height="200" viewBox="0 0 200 200" style="border: 2px solid var(--border-light); border-radius: 50%; background: rgba(45, 55, 72, 0.5); box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.3); transition: box-shadow var(--transition-normal);">
                        <circle cx="100" cy="100" r="95" fill="none" stroke="#333" stroke-width="1"/>
                        <line x1="100" y1="5" x2="100" y2="195" stroke="#222" stroke-width="1"/>
                        <line x1="5" y1="100" x2="195" y2="100" stroke="#222" stroke-width="1"/>
                        <line x1="40" y1="100" x2="160" y2="100" stroke="#333" stroke-width="2" stroke-dasharray="3,3"/>
                        <path d="M 100 40 A 60 60 0 0 0 100 160" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
                        <circle id="positionMarker" cx="100" cy="100" r="8" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/>
                        <line id="markerLineH" x1="100" y1="100" x2="100" y2="100" stroke="var(--accent)" stroke-width="1" opacity="0.5"/>
                        <line id="markerLineV" x1="100" y1="100" x2="100" y2="100" stroke="var(--accent)" stroke-width="1" opacity="0.5"/>
                    </svg>
                </div>
                
                <!-- Pan/Tilt Angle Display -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; text-align: center;">
                    <div style="background: rgba(45, 55, 72, 0.5); padding: 8px; border-radius: var(--radius-md); font-size: 11px; border: 1px solid var(--border-color);">
                        <div style="color: var(--text-tertiary);">Pan</div>
                        <div style="font-size: 16px; color: var(--accent); font-weight: bold;" id="panAngle">0°</div>
                    </div>
                    <div style="background: rgba(45, 55, 72, 0.5); padding: 8px; border-radius: var(--radius-md); font-size: 11px; border: 1px solid var(--border-color);">
                        <div style="color: var(--text-tertiary);">Tilt</div>
                        <div style="font-size: 16px; color: var(--accent); font-weight: bold;" id="tiltAngle">0°</div>
                    </div>
                </div>

                <div class="slider-group">
                    <div class="slider-label">Pan speed: <span id="val_pan_speed">500 Hz</span></div>
                    <input type="range" min="0" max="100" value="21" id="slider_pan_speed">
                </div>
                <div class="slider-group">
                    <div class="slider-label">Tilt speed: <span id="val_tilt_speed">500 Hz</span></div>
                    <input type="range" min="0" max="100" value="21" id="slider_tilt_speed">
                </div>
                
                <!-- D-Pad -->
                <div style="text-align: center; width: 100%;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 8px; align-items: center;">
                        <div></div>
                        <button class="btn-motor" id="btn_motor_up" style="grid-column: 2; padding: 20px 0; font-size: 18px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">↑</button>
                        <div></div>
                        <button class="btn-motor" id="btn_motor_left" style="padding: 20px 0; font-size: 18px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">←</button>
                        <button class="btn-motor" id="btn_motor_home" style="padding: 12px 0; font-size: 12px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">HOME</button>
                        <button class="btn-motor" id="btn_motor_right" style="padding: 20px 0; font-size: 18px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">→</button>
                        <div></div>
                        <button class="btn-motor" id="btn_motor_down" style="grid-column: 2; padding: 20px 0; font-size: 18px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">↓</button>
                        <div></div>
                    </div>
                    <div style="font-size: 10px; color: var(--text-tertiary);">Pan / Tilt Control</div>
                </div>
            </div>
        </div>
