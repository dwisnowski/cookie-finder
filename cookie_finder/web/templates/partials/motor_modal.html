    <!-- Motor Control Modal (mobile portrait) -->
    <div id="motorOverlay" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="closeMotorBtn">&times;</button>
            <div class="modal-header">Motor Control</div>

            <div style="background: rgba(45, 55, 72, 0.5); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-md); text-align: center; border: 1px solid var(--border-color);">
                <div style="color: var(--text-tertiary); margin-bottom: 8px; font-size: 11px; font-weight: bold;">Button Press Display</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px;">
                    <div class="gamepad-button gamepad-button-display" data-gamepad-index="0" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">A</div>
                    <div class="gamepad-button gamepad-button-display" data-gamepad-index="1" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">B</div>
                    <div class="gamepad-button gamepad-button-display" data-gamepad-index="2" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">X</div>
                    <div class="gamepad-button gamepad-button-display" data-gamepad-index="3" style="padding: 12px; background: rgba(45, 55, 72, 0.5); border-radius: var(--radius-sm); font-weight: bold; font-size: 12px; cursor: default; border: 1px solid var(--border-color);">Y</div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; text-align: center;">
                <div style="background: rgba(45, 55, 72, 0.5); padding: 8px; border-radius: var(--radius-md); font-size: 11px; border: 1px solid var(--border-color);">
                    <div style="color: var(--text-tertiary);">Pan</div>
                    <div class="pan-angle-value" style="font-size: 16px; color: var(--accent); font-weight: bold;">0°</div>
                </div>
                <div style="background: rgba(45, 55, 72, 0.5); padding: 8px; border-radius: var(--radius-md); font-size: 11px; border: 1px solid var(--border-color);">
                    <div style="color: var(--text-tertiary);">Tilt</div>
                    <div class="tilt-angle-value" style="font-size: 16px; color: var(--accent); font-weight: bold;">0°</div>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">Pan speed: <span class="val-pan-speed-label">100 Hz</span></div>
                <input type="range" min="0" max="100" value="38" id="slider_pan_speed_modal">
            </div>
            <div class="slider-group">
                <div class="slider-label">Tilt speed: <span class="val-tilt-speed-label">100 Hz</span></div>
                <input type="range" min="0" max="100" value="38" id="slider_tilt_speed_modal">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: var(--spacing-md);">
                <button class="btn-motor" id="btn_motor_zero_modal" title="Set current position as 0°, 0° (new home)" style="padding: 10px 16px; font-size: 11px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">ZERO</button>
                <button class="btn-motor" id="btn_motor_home_modal" style="padding: 10px 16px; font-size: 11px; background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(30, 90, 58, 0.6) 100%);">HOME</button>
            </div>

            <div style="font-size: 10px; color: var(--text-tertiary); text-align: center; margin-top: 12px;">
                Touch the video edges to pan / tilt
            </div>
        </div>
    </div>
