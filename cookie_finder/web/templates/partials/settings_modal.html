    <!-- Settings Modal -->
    <div id="settingsOverlay" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="closeSettingsBtn">&times;</button>
            <div class="modal-header">⚙️ Settings</div>
            
            <!-- Joystick Preset Section -->
            <div style="background: rgba(45, 55, 72, 0.5); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-md); text-align: center; border: 1px solid var(--border-color);">
                <div style="color: var(--text-tertiary); margin-bottom: 6px; font-size: 11px; font-weight: bold;">Joystick Preset</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                    <button class="btn-preset" id="btn_preset_normal" style="font-size: 10px; padding: 8px;">Normal</button>
                    <button class="btn-preset" id="btn_preset_vertical" style="font-size: 10px; padding: 8px;">Vertical</button>
                </div>
                <div id="currentPresetDisplay" style="margin-top: 6px; color: var(--accent); font-weight: bold; font-size: 11px;">Current: Normal</div>
            </div>
            
            <!-- Joystick Axis Mapping Section -->
            <div style="background: rgba(45, 55, 72, 0.5); padding: var(--spacing-md); border-radius: var(--radius-md); margin-bottom: var(--spacing-md); font-size: 11px; border: 1px solid var(--border-color);">
                <div style="color: var(--text-tertiary); margin-bottom: 8px; font-weight: bold;">Joystick Axis Mapping</div>
                <div style="margin-bottom: 8px;">
                    <label style="display: block; color: var(--text-secondary); margin-bottom: 3px;">Pan (Horizontal)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                        <button class="btn-axis" id="btn_pan_axis_0" style="font-size: 10px; padding: 6px;">Left X</button>
                        <button class="btn-axis" id="btn_pan_axis_1" style="font-size: 10px; padding: 6px;">Left Y</button>
                        <button class="btn-axis" id="btn_pan_axis_2" style="font-size: 10px; padding: 6px;">Right X</button>
                        <button class="btn-axis" id="btn_pan_axis_3" style="font-size: 10px; padding: 6px;">Right Y</button>
                    </div>
                    <button class="btn-toggle" id="btn_invert_pan" style="font-size: 10px; padding: 4px; margin-top: 4px; width: 100%;">Invert Pan: OFF</button>
                </div>
                <div>
                    <label style="display: block; color: var(--text-secondary); margin-bottom: 3px;">Tilt (Vertical)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                        <button class="btn-axis" id="btn_tilt_axis_0" style="font-size: 10px; padding: 6px;">Left X</button>
                        <button class="btn-axis" id="btn_tilt_axis_1" style="font-size: 10px; padding: 6px;">Left Y</button>
                        <button class="btn-axis" id="btn_tilt_axis_2" style="font-size: 10px; padding: 6px;">Right X</button>
                        <button class="btn-axis" id="btn_tilt_axis_3" style="font-size: 10px; padding: 6px;">Right Y</button>
                    </div>
                    <button class="btn-toggle" id="btn_invert_tilt" style="font-size: 10px; padding: 4px; margin-top: 4px; width: 100%;">Invert Tilt: OFF</button>
                </div>
            </div>
            
            <!-- Device Controls Section -->
            <div style="background: rgba(45, 55, 72, 0.5); padding: var(--spacing-md); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                <div style="color: var(--text-tertiary); margin-bottom: 8px; font-weight: bold;">Device Controls</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                    <button class="btn" id="btn_reconnect_settings" style="font-size: 11px; background: linear-gradient(135deg, rgba(170, 102, 0, 0.8) 0%, rgba(200, 120, 0, 0.6) 100%);">Reconnect</button>
                    <button class="btn" id="btn_cycle_gamepad_settings" style="font-size: 11px;">🎮 Cycle Device</button>
                </div>
            </div>
        </div>
    </div>
